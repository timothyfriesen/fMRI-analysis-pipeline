[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "achi-pipeline"
version = "0.1.0"
description = "ACHI task-fMRI pipeline: DICOM -> BIDS -> fMRIPrep -> SPM first level -> ROIs and figures"
requires-python = ">=3.10"
# Exact pins live in requirements.txt / environment.yml.
dependencies = ["numpy", "pandas", "scipy", "nibabel", "nilearn", "matplotlib",
                "pydicom", "PyYAML", "dcm2bids"]

[project.scripts]
achi = "achi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
